<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>小红书配图预览 · RetireCount</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 48px; background: #0b1220; color: #e2e8f0;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }
  h1 { font-size: 22px; font-weight: 700; margin: 0 0 6px; }
  p.sub { color: #64748b; font-size: 13px; margin: 0 0 32px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; max-width: 1280px; }
  figure { margin: 0; }
  img { width: 100%; display: block; border-radius: 12px; border: 1px solid rgba(255,255,255,.08); }
  figcaption { margin-top: 8px; font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <h1>小红书配图 · 9 张（1080×1440）</h1>
  <p class="sub">顺序即发布顺序 · 数字来自演示档案（上海 / 1994 年 / 55 岁 / 月薪 ¥25,000）</p>
  <div class="grid">
    <figure><img src="./01.png" alt="封面"><figcaption>01 封面：你还要上 8258 天班？</figcaption></figure>
    <figure><img src="./02.png" alt="倒计时"><figcaption>02 倒计时</figcaption></figure>
    <figure><img src="./03.png" alt="一句话结论"><figcaption>03 一句话结论</figcaption></figure>
    <figure><img src="./04.png" alt="三个数字"><figcaption>04 三个数字</figcaption></figure>
    <figure><img src="./05.png" alt="钱从哪来"><figcaption>05 钱从哪来</figcaption></figure>
    <figure><img src="./06.png" alt="缺口曲线"><figcaption>06 缺口曲线</figcaption></figure>
    <figure><img src="./07.png" alt="生活蓝图"><figcaption>07 生活蓝图</figcaption></figure>
    <figure><img src="./08.png" alt="隐私与离线"><figcaption>08 隐私与离线</figcaption></figure>
    <figure><img src="./09.png" alt="结尾"><figcaption>09 结尾：搜 RetireCount</figcaption></figure>
  </div>
</body>
</html>
