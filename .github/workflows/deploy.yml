name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      # 环境自检：把关键信息写进 annotation，未登录也能在公开仓库读到
      - name: Environment
        run: |
          echo "node=$(node -v) npm=$(npm -v)"
          echo "vitest=$(command -v vitest || echo MISSING)"
          echo "bin_count=$(ls node_modules/.bin | wc -l)"
          echo "::notice title=environment::node=$(node -v) npm=$(npm -v) vitest=$(command -v vitest || echo MISSING) bins=$(ls node_modules/.bin | wc -l) cwd=$(pwd)"

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            msg=$(tail -c 2500 /tmp/test.log | tr '\n' '~' | tr -d '\r')
            echo "::error title=tests failed ($status)::$msg"
            exit "$status"
          fi

      - name: Build
        run: npm run build
        env:
          # 项目页部署在 /<repo>/ 下；<user>.github.io 这类用户页需要改成 "/"
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
