name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 关键：npm ci 只要有一个 optional 平台包（esbuild / rollup）没装好，
      # 后面出现的报错就只有一句 "command not found"（退出码 127）。所以显式重试 + 校验。
      - name: Install
        shell: bash
        run: |
          set -o pipefail
          export npm_config_fetch_retries=5
          export npm_config_fetch_retry_mintimeout=20000
          export npm_config_fetch_retry_maxtimeout=120000
          export npm_config_fetch_timeout=120000
          for i in 1 2 3; do
            echo "== attempt $i =="
            if npm ci --no-audit --no-fund --prefer-offline 2>&1 | tee /tmp/install.log; then
              exit 0
            fi
            sleep $((i * 15))
          done
          echo "::error title=npm ci failed::$(tail -c 2000 /tmp/install.log | tr '\n' '~' | tr -d '\r')"
          exit 1

      - name: Verify toolchain
        shell: bash
        run: |
          set -o pipefail
          {
            echo "node=$(node -v) npm=$(npm -v)"
            node -e "console.log('esbuild=' + require('esbuild').version)"
            node -e "console.log('rollup=' + require('rollup').VERSION)"
            node -e "console.log('vite=' + require('vite').version)"
            test -x node_modules/.bin/vitest && echo "vitest=ok"
          } 2>&1 | tee /tmp/verify.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error title=toolchain broken::$(tail -c 2000 /tmp/verify.log | tr '\n' '~' | tr -d '\r')"
            exit "$status"
          fi

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error title=tests failed ($status)::$(tail -c 2500 /tmp/test.log | tr '\n' '~' | tr -d '\r')"
            exit "$status"
          fi

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error title=build failed ($status)::$(tail -c 2500 /tmp/build.log | tr '\n' '~' | tr -d '\r')"
            exit "$status"
          fi
        env:
          # 项目页部署在 /<repo>/ 下；<user>.github.io 这类用户页需要改成 "/"
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # 失败时把上下文推到 ci-diagnostics 分支（公开仓库可直接读，不用登录）
      - name: Publish failure context
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          mkdir -p /tmp/diag
          {
            echo "=== env ==="
            node -v; npm -v
            env | sort | grep -v -i -E 'token|secret|key' | head -60
            echo; echo "=== bins ==="
            ls node_modules/.bin 2>/dev/null | head -60
            echo; echo "=== install ==="; tail -120 /tmp/install.log 2>/dev/null
            echo; echo "=== verify ==="; cat /tmp/verify.log 2>/dev/null
            echo; echo "=== test ==="; tail -200 /tmp/test.log 2>/dev/null
            echo; echo "=== build ==="; tail -200 /tmp/build.log 2>/dev/null
          } > /tmp/diag/diagnostics.txt
          cd /tmp/diag
          git init -q
          git add diagnostics.txt
          git -c user.email=ci@local -c user.name=ci commit -qm "ci diagnostics"
          git -c credential.helper= push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci-diagnostics

      # 构建成功也留个标记，用来区分「构建挂了」和「只是 Pages 没配置好」
      - name: Publish build marker
        if: success()
        continue-on-error: true
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          mkdir -p /tmp/diag
          {
            echo "build ok at $(date -u +%FT%TZ)"
            echo "commit=${{ github.sha }}"
            echo "dist files: $(find dist -type f | wc -l)"
            find dist -maxdepth 2 -type f | head -30
          } > /tmp/diag/build-ok.txt
          cd /tmp/diag
          git init -q
          git add build-ok.txt
          git -c user.email=ci@local -c user.name=ci commit -qm "build ok"
          git -c credential.helper= push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci-diagnostics

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
